<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zhaozhao Ma</title>
  <meta name="description" content="I have a lot of stories to tell you ✨" />
  <meta name="color-scheme" content="light dark" />
  <style>
    :root{
      --bg0:#0b0f17;
      --bg1:#0f1626;
      --card: rgba(255,255,255,.08);
      --card2: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.66);
      --line: rgba(255,255,255,.18);
      --accent:#b7f7d7;
      --accent2:#f4b6d2;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --radius: 24px;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg0:#f7f7fb;
        --bg1:#eef1ff;
        --card: rgba(255,255,255,.72);
        --card2: rgba(255,255,255,.92);
        --text: rgba(14,18,30,.92);
        --muted: rgba(14,18,30,.62);
        --line: rgba(14,18,30,.12);
        --shadow: 0 18px 50px rgba(10,20,40,.12);
      }
    }

    html,body{height:100%;}
    body{
      margin:0;
      font-family: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype",
                   "Times New Roman", Georgia, serif;
      background:
        radial-gradient(1200px 900px at 20% 20%, color-mix(in oklab, var(--accent2) 35%, transparent) 0%, transparent 60%),
        radial-gradient(1200px 900px at 80% 30%, color-mix(in oklab, var(--accent) 35%, transparent) 0%, transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }

    .wrap{width:min(860px, 100%);}

    .card{
      background: linear-gradient(180deg, var(--card2), var(--card));
      border: 1px solid color-mix(in oklab, var(--line) 80%, transparent);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }

    .topline{
      height: 3px;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      opacity:.9;
    }

    .inner{
      padding: 42px 42px 34px;
    }

    h1{
      margin:0 0 10px;
      font-size: clamp(34px, 4.4vw, 54px);
      font-weight: 700;
      letter-spacing: .2px;
    }

    .lead{
      margin: 0 0 18px;
      font-size: clamp(16px, 2.0vw, 20px);
      color: var(--muted);
      line-height: 1.6;
    }

    .divider{
      height:1px;
      background: var(--line);
      margin: 22px 0 18px;
    }

    .note{
      margin:0;
      font-size: 15px;
      color: var(--muted);
      line-height: 1.8;
    }

    .note strong{
      color: var(--text);
      font-weight: 600;
    }

    .links{
      margin-top: 20px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    a.pill{
      text-decoration:none;
      color: var(--text);
      border: 1px solid var(--line);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      background: rgba(255,255,255,.02);
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    a.pill:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.06);
      border-color: color-mix(in oklab, var(--line) 70%, var(--accent) 30%);
    }

    footer{
      padding: 0 42px 26px;
      color: var(--muted);
      font-size: 13px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .smallcaps{font-variant: small-caps; letter-spacing:.6px;}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card" role="main" aria-label="Personal homepage placeholder">
      <div class="topline"></div>
      <div class="inner">
        <h1>Zhaozhao Ma</h1>
        <p class="lead">I have a lot of stories to tell you 😊✨</p>

        <div class="divider"></div>

        <p class="note">
          <strong>To be written</strong> 🔬🌿<br/>
        </p>
        
        <div class="links">
          <a class="pill" href="mailto:zhaozhaoma@zju.edu.cn">Email</a>
          <a class="pill" href="#" onclick="return false;" title="Add later">CV (soon)</a>
          <a class="pill" href="#" onclick="return false;" title="Add later">Publications (soon)</a>
          <a class="pill" href="https://github.com/zhaozhaoma" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>

      <footer>
        <span class="smallcaps">Working page</span>
        <span>© <span id="y"></span> Zhaozhao Ma</span>
      </footer>
    </div>
  </div>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>
</body>
</html>
